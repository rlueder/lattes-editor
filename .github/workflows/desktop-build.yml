name: App de desktop

# Monta o app de desktop (Tauri) para macOS, Windows e Linux. Chamado pelo
# Release com a tag recém-criada: os instaladores vão para a página daquele
# lançamento com nomes fixos, para a página do projeto apontar sempre para
# releases/latest/download/<nome>. Em PR que mexe no app, só monta, sem enviar.
#
# No lançamento, o app de macOS sai assinado com o Developer ID e notarizado
# pela Apple, e abre sem aviso; sem os segredos, o lançamento falha. O
# instalador do Windows ainda não é assinado: o SmartScreen avisa na primeira
# abertura.
#
# No lançamento, cada sistema também gera o pacote de atualização assinado com
# a chave de atualização (TAURI_SIGNING_PRIVATE_KEY, separada da Apple), e o
# tauri-action monta o latest.json que o app confere
# (releases/latest/download/latest.json). Em PR, sem a chave, não gera.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag do lançamento que recebe os instaladores.
        required: true
        type: string
    # Assinatura Developer ID e notarização do app de macOS (só nos lançamentos).
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_P8:
        required: false
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/desktop/**'
      - '.github/workflows/desktop-build.yml'
  # Manual, com uma tag, refaz os instaladores de um lançamento que ficou sem
  # eles (o Release falhou depois de criar a tag); sem tag, só monta.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag do lançamento que recebe os instaladores (vazio só monta).
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # Um app só para Apple Silicon e Intel.
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            asset: LattesEditor-macOS[ext]
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            asset: LattesEditor-Windows[setup][ext]
          - name: Linux
            # 22.04: glibc mais antiga, o AppImage abre em mais distribuições.
            os: ubuntu-22.04
            args: --bundles appimage,deb
            asset: LattesEditor-Linux[ext]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Alvos do Rust (macOS universal)
        if: matrix.rust-targets
        run: rustup target add ${{ matrix.rust-targets }}
      - name: Bibliotecas do WebView (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # Só no lançamento do macOS: certificado Developer ID e chave da App Store
      # Connect para notarizar; o tauri-action lê as variáveis APPLE_* do
      # ambiente. Faltando segredo, o lançamento falha: um app sem assinatura
      # substituiria o assinado nos links fixos de download.
      - name: Assinatura e notarização (macOS)
        if: runner.os == 'macOS' && inputs.tag != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          names="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8"
          missing=""
          for name in $names; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltam segredos da Apple:$missing"
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$key")
          # O base64 do certificado pode vir quebrado em linhas; o resto vai com
          # delimitador, que aceita qualquer conteúdo. Sem as quebras, o valor
          # muda e precisa de máscara própria nos logs.
          APPLE_CERTIFICATE=$(printf '%s' "$APPLE_CERTIFICATE" | tr -d ' \r\n')
          echo "::add-mask::$APPLE_CERTIFICATE"
          APPLE_API_KEY_PATH="$key"
          delim="APPLE_$(openssl rand -hex 16)"
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH; do
            printf '%s<<%s\n%s\n%s\n' "$name" "$delim" "${!name}" "$delim" >> "$GITHUB_ENV"
          done
      # Sem a chave de atualização, o lançamento falha: um app sem o pacote de
      # atualização deixaria quem já tem o app parado na versão anterior.
      - name: Chave de atualização
        if: inputs.tag != ''
        # O Windows roda PowerShell por padrão; o teste abaixo é de bash.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Falta o segredo TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi
      # O lançamento novo é um rascunho (.releaserc.cjs); refazer os instaladores
      # de um já publicado (disparo manual) sobe para a página publicada. O
      # tauri-action só acha um rascunho pela tag quando sabe que é rascunho.
      - name: Rascunho ou publicado
        id: release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .draft" | head -n 1)
          if [ -z "$draft" ]; then
            echo "::error::Não há página de lançamento para $TAG"
            exit 1
          fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Sem tag (PR, disparo manual sem tag), só monta e guarda como artefato do workflow.
          tagName: ${{ inputs.tag }}
          releaseDraft: ${{ steps.release.outputs.draft == 'true' }}
          releaseAssetNamePattern: ${{ matrix.asset }}
          uploadWorkflowArtifacts: ${{ inputs.tag == '' }}
          # A assinatura de cada pacote vai dentro do latest.json; os .sig soltos
          # só encheriam a página do lançamento.
          uploadUpdaterSignatures: false
          uploadUpdaterJson: ${{ inputs.tag != '' }}
          # Pacote de atualização só no lançamento, onde há a chave para assinar
          # (src-tauri/tauri.release.conf.json liga o createUpdaterArtifacts).
          args: >-
            ${{ matrix.args }}
            ${{ inputs.tag != '' && '--config src-tauri/tauri.release.conf.json' || '' }}
