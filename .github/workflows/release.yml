name: Lançar versão

# Merge na main não lança nada: as mudanças se acumulam até este workflow,
# disparado à mão (Actions, ou `gh workflow run release.yml`). Ele confere
# que o CI da main passou no commit atual, e o semantic-release decide uma
# versão só para tudo o que entrou desde o último lançamento: atualiza o
# CHANGELOG, cria a tag e a página do lançamento como rascunho, com a extensão
# (ver .releaserc.cjs). Em seguida o app de desktop é montado nos três
# sistemas e entra no mesmo rascunho.
#
# O rascunho é o portão: o app instalado e a página do projeto só veem a
# versão depois do workflow "Publicar versão" (publicar.yml), disparado à mão
# depois de testar os instaladores do rascunho.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    # Versão só sai da main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      # Sem CI verde no commit que vira versão, não há lançamento.
      - name: CI da main passou neste commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --commit "$GITHUB_SHA" --event push --json conclusion --jq '.[0].conclusion // ""')
          if [ "$conclusion" != "success" ]; then
            echo "::error::O CI da main não passou em $GITHUB_SHA (resultado: ${conclusion:-nenhum}). Espere o CI ou corrija antes de lançar."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # O commit de lançamento não passa pelos hooks do Husky: o CI já rodou tudo.
          HUSKY: '0'
      # A tag que o semantic-release acabou de criar, ou vazio se não houve lançamento.
      - id: tag
        run: echo "tag=$(git tag --points-at HEAD --list 'v*' | head -n 1)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/desktop-build.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    # Os segredos da assinatura do macOS e da chave de atualização (ver desktop-build.yml).
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
