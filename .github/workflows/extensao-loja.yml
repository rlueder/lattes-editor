name: 'PROD 3: enviar extensão à Chrome Web Store'

# Só por disparo manual, depois de publicar o app compatível no PROD 2.
# Reutiliza o ZIP daquele lançamento; não remonta a extensão na main atual.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag do lançamento já publicado no GitHub, como v1.0.0.
        required: true
        type: string
      confirmar:
        description: Enviar esta versão à revisão e publicar quando a loja aprovar.
        required: true
        default: false
        type: boolean

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enviar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Conferir e baixar o lançamento publicado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMAR" != true ] || ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Informe uma tag estável e confirme o envio à revisão.'
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets > release.json
          jq -e --arg tag "$TAG" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == false' release.json > /dev/null
          mkdir -p pacote-loja
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern lattes-editor-extensao-loja.zip --dir pacote-loja
          digest=$(jq -r '.assets[] | select(.name == "lattes-editor-extensao-loja.zip") | .digest' release.json)
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::O lançamento não tem o SHA-256 do pacote da loja.'
            exit 1
          fi
          echo "${digest#sha256:}  pacote-loja/lattes-editor-extensao-loja.zip" | sha256sum --check
          gh api "repos/$GITHUB_REPOSITORY/contents/src-tauri/src/conector.rs?ref=$TAG" \
            --jq .content | base64 --decode > pacote-loja/conector.rs
      - name: Enviar à revisão da loja
        env:
          CWS_RELEASE_TAG: ${{ inputs.tag }}
          CWS_ZIP_PATH: pacote-loja/lattes-editor-extensao-loja.zip
          CWS_NATIVE_HOST_PATH: pacote-loja/conector.rs
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID || secrets.CWS_PUBLISHER_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: node scripts/publicar-extensao.ts
