name: Página do projeto

# Publica site/ no GitHub Pages (https://rlueder.github.io/lattes-editor/).
# Só a página do projeto: o editor não é hospedado, só se distribui como app
# (ROADMAP). Roda quando site/ muda na main, ou à mão.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Uma publicação por vez; a mais nova não cancela a que está no meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # PR de fork vai sempre para runner do GitHub; o resto segue RUNS_ON
    # (ver ci/runner-efemero/README.md). Sem a variável, ubuntu-latest.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.RUNS_ON || '"ubuntu-latest"') || 'ubuntu-latest' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
