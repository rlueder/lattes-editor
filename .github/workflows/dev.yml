name: Versão Dev

# O canal Dev, como o Nightly do Firefox ou o Insiders do VS Code: a cada merge
# na main (depois do CI verde), monta o LattesEditor Dev nos três sistemas e a
# extensão "LattesEditor Dev: Conector", para testar o que vai entrar na
# próxima versão antes do "Lançar versão".
#
# O LattesEditor Dev convive com o app publicado: outro nome, identificador,
# ícone (com o selo DEV), pasta de dados e entrada no chaveiro, e outro host
# nativo, que só a extensão Dev chama. Ele se atualiza sozinho pela página
# "dev" (releases/download/dev/latest.json); o app publicado nunca vê o canal.
#
# A página "dev" é uma pré-estreia que se refaz a cada build: a anterior é
# apagada com a tag, e a nova aponta para o commit do build. Não é rascunho
# (o "Publicar versão" não a toca) nem a mais recente (releases/latest a
# ignora). A versão é a do package.json com o número do build
# (0.22.0-dev.42): sempre maior que a do build anterior.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Refazer o Dev da main sem esperar um merge.
  workflow_dispatch:

# Um merge novo torna o build em andamento velho: fica só o mais recente.
concurrency:
  group: dev
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preparar:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - id: versao
        run: echo "versao=$(node -p 'require("./package.json").version')-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Extensão do canal Dev
        env:
          LATTES_VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          pnpm build:extension --canal-dev
          mkdir -p release
          (cd dist-extension-dev && zip -qr ../release/lattes-editor-dev-extensao.zip .)
      # A página "dev" de antes sai com a tag; a nova nasce no commit deste build.
      - name: Página "dev"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSAO: ${{ steps.versao.outputs.versao }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          gh release delete dev --cleanup-tag --yes 2>/dev/null || true
          gh release create dev release/lattes-editor-dev-extensao.zip \
            --prerelease --latest=false --target "$SHA" \
            --title "LattesEditor Dev $VERSAO" \
            --notes "Canal Dev, montado da main em ${SHA:0:7}. Não é uma versão publicada: serve para testar o que vai entrar na próxima. Instale o LattesEditor Dev ao lado do LattesEditor e carregue a extensão Dev descompactada (chrome://extensions, modo do desenvolvedor). O app Dev se atualiza sozinho por esta página."

  desktop:
    needs: preparar
    uses: ./.github/workflows/desktop-build.yml
    with:
      tag: dev
      versao: ${{ needs.preparar.outputs.versao }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
