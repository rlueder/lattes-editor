name: 'DEV: montar o LattesEditor Dev (de hora em hora)'

# O canal Dev, como o Nightly do Firefox ou o Insiders do VS Code. De hora em
# hora, se a main mudou desde o último Dev e o CI dela passou, monta o
# LattesEditor Dev nos três sistemas e a extensão "LattesEditor Dev:
# Conector", para testar o que vai entrar na próxima versão antes do
# "PROD 1: lançar versão". Vários merges na mesma hora dão um build só; um
# merge que só muda documentação (docs/, site/, README) não dá nenhum. Para
# montar sem esperar a hora: Actions, "Run workflow", ou
# `gh workflow run dev.yml`; com `forcar` marcado, monta mesmo sem mudança.
#
# O LattesEditor Dev convive com o app publicado: outro nome, identificador,
# ícone (com o selo DEV), pasta de dados e entrada no chaveiro, e outro host
# nativo, que só a extensão Dev chama. Ele se atualiza sozinho pela página
# "dev" (releases/download/dev/latest.json); o app publicado nunca vê o canal.
#
# A página "dev" é uma pré-estreia que se refaz a cada build: a anterior é
# apagada com a tag, e a nova aponta para o commit do build. Não é rascunho
# (o "PROD 2: publicar versão" não a toca) nem a mais recente (releases/latest
# a ignora). A versão é a do package.json com o número do build
# (0.22.0-dev.42): sempre maior que a do build anterior.

on:
  schedule:
    - cron: '0 * * * *' # a cada hora cheia (UTC)
  workflow_dispatch:
    inputs:
      forcar:
        description: Montar mesmo sem mudança na main desde o último Dev, ou só com documentação.
        required: false
        type: boolean
        default: false

# Um build em andamento sempre termina: cancelado no meio, ele deixaria a
# página "dev" sem latest.json até o build seguinte. Um disparo à mão durante
# um build espera por ele.
concurrency:
  group: dev
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Decide se há o que montar: o topo da main, se ele mudou desde o commit de
  # que o Dev de agora foi montado (o alvo da página "dev"), se a mudança não é
  # só documentação e se o CI da main passou nele. Fora disso, o workflow
  # termina aqui, em segundos.
  topo:
    # Só da main: o cron já roda nela, e um disparo à mão de outra branch
    # rodaria o workflow daquela branch com permissão de escrita.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.topo.outputs.sha }}
    steps:
      - id: topo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCAR: ${{ inputs.forcar }}
        run: |
          set -euo pipefail
          topo=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          # O commit de que o Dev de agora foi montado: o alvo da página "dev",
          # que o passo "Página dev" cria com --target no SHA. Sem página (a
          # primeira vez), ou com um alvo que não é SHA, não dá para comparar:
          # monta.
          base=$(gh release view dev --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            base=""
          fi
          if [ "$FORCAR" != true ]; then
            if [ "$base" = "$topo" ]; then
              echo "::notice::A main não mudou desde o último Dev (${topo:0:7}): nada a montar."
              exit 0
            fi
            if [ -n "$base" ]; then
              # Todas as páginas da comparação (ela vem paginada). Se a chamada
              # falha (o commit de antes sumiu num rebase, por exemplo) ou não
              # lista arquivo nenhum, fica "não sei": monta.
              arquivos=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$base...$topo" --jq '.files[].filename' 2>/dev/null || true)
              if [ -n "$arquivos" ] && ! grep -qvE '^(docs/|site/|README\.md$|CHANGELOG\.md$|ROADMAP\.md$|LICENSE$|\.github/workflows/pages\.yml$)' <<<"$arquivos"; then
                echo "::notice::Desde o último Dev (${base:0:7}) só mudou documentação: nada a montar."
                exit 0
              fi
            fi
          fi
          verdes=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$topo&event=push&status=success" --jq .total_count)
          if [ "$verdes" = 0 ]; then
            echo "::notice::O CI do topo da main (${topo:0:7}) ainda não passou: fica para a próxima hora."
            exit 0
          fi
          echo "sha=$topo" >> "$GITHUB_OUTPUT"

  preparar:
    needs: topo
    if: needs.topo.outputs.sha != ''
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.topo.outputs.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - id: versao
        run: echo "versao=$(node -p 'require("./package.json").version')-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Extensão do canal Dev
        env:
          LATTES_VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          pnpm build:extension --canal-dev
          mkdir -p release
          (cd dist-extension-dev && zip -qr ../release/lattes-editor-dev-extensao.zip .)
      # A página "dev" de antes sai com a tag; a nova nasce no commit deste build.
      - name: Página "dev"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSAO: ${{ steps.versao.outputs.versao }}
          SHA: ${{ needs.topo.outputs.sha }}
        # Só "não existe" passa em silêncio (a primeira vez); outra falha do gh
        # (permissão, rede) para aqui, com a mensagem dele.
        run: |
          if ! saida=$(gh release view dev --json tagName 2>&1); then
            if [ "$saida" != "release not found" ]; then
              echo "$saida" >&2
              exit 1
            fi
          else
            gh release delete dev --cleanup-tag --yes
          fi
          gh release create dev release/lattes-editor-dev-extensao.zip \
            --prerelease --latest=false --target "$SHA" \
            --title "LattesEditor Dev $VERSAO" \
            --notes "Canal Dev, montado da main em ${SHA:0:7}. Não é uma versão publicada: serve para testar o que vai entrar na próxima. Instale o LattesEditor Dev ao lado do LattesEditor e abra o app: ele traz a extensão Dev e mostra a pasta para carregar uma vez no navegador (chrome://extensions, modo do desenvolvedor, Carregar sem compactação). Depois, app e extensão se atualizam sozinhos por esta página."

  desktop:
    needs: preparar
    uses: ./.github/workflows/desktop-build.yml
    with:
      tag: dev
      versao: ${{ needs.preparar.outputs.versao }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
