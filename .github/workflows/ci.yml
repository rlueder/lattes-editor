name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR para rodar a revisão automática de novo'
        required: false
        type: number

permissions:
  contents: read

jobs:
  checks:
    name: lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Os testes validam o XML gerado contra o XSD com o xmllint.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm build:extension

  # Revisão automática do tooling da Precisa, em duas rodadas por PR. O que
  # vai para o provedor está em .github/review-policy.json, lido do commit
  # base: mudar a política só vale depois do merge.
  review:
    permissions:
      contents: read
      issues: read
      pull-requests: write
      models: read
    needs: checks
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.pr_number > 0)
    uses: Precisa-Saude/tooling/.github/workflows/review.yml@7b42c968c2da27c702d05ae1cd282557581a918d # v3.0.0
    with:
      # fromJSON porque no workflow_dispatch o pr_number chega como string,
      # mesmo declarado `type: number`, e reprova o input `number` do review.yml.
      pr_number: ${{ fromJSON(github.event.pull_request.number || inputs.pr_number || 0) }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
