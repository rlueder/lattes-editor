<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conector</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="topo">
      <span class="marca">Lattes<span class="marca-destaque">Editor</span></span>
      <span class="topo-sub">Conector</span>
    </header>
    <main id="aviso" class="painel aviso" hidden>
      <h1 class="aviso-titulo">Antes de usar o conector</h1>
      <p>
        Para levar suas alterações, a extensão lê e grava o seu currículo no Lattes
        (<code>wwws.cnpq.br</code>), só quando você pede.
      </p>
      <p>Os dados vão só para o Lattes e para o app no seu computador, sem servidor.</p>
      <div class="aviso-acoes">
        <button id="aceitar" type="button" class="principal">Concordo, usar o conector</button>
      </div>
      <p>
        <a id="aviso-politica" target="_blank" rel="noopener noreferrer">Política de privacidade</a>
      </p>
      <p class="aviso-nota" role="alert"></p>
    </main>
    <main id="conector" class="painel" hidden>
      <p class="ajuda"></p>
      <p class="lembrete" hidden></p>
      <p id="pausa" class="pausa" role="status" hidden></p>
      <p id="versoes" class="versoes" hidden></p>
      <div class="acoes">
        <button id="acao" type="button" class="principal">Aplicar todas</button>
        <button id="limpar" type="button" class="fantasma discreto">Limpar fila</button>
      </div>
      <ul id="fila"></ul>
      <section class="vigia" aria-labelledby="vigia-titulo" hidden>
        <div class="vigia-topo">
          <h2 id="vigia-titulo" class="vigia-titulo"></h2>
          <button id="verificar" type="button" class="fantasma">Verificar de novo</button>
        </div>
        <div id="vigia-resultado"></div>
      </section>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
