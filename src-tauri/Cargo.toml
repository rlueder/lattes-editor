[package]
name = "lattes-editor"
version = "0.1.1"
description = "LattesEditor: editor local do Currículo Lattes"
authors = ["Rafael Lüder"]
license = "MIT"
edition = "2021"

[lib]
name = "lattes_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# O executável leva o nome do app: o macOS mostra esse nome no Dock quando
# o app roda sem o pacote .app (pnpm desktop:dev).
[[bin]]
name = "LattesEditor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "=2.8.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
