<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- Imagem de prévia da página do projeto (site/img/og.png, 1200 × 630),
         renderizada por scripts/capture-screenshots.ts pelo servidor do Vite. -->
    <link rel="stylesheet" href="/site/fonts/fonts.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #f6f4f1;
        color: #21201c;
        font-family: 'IBM Plex Sans', sans-serif;
      }
      .text {
        position: absolute;
        top: 84px;
        left: 72px;
        width: 470px;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 44px;
      }
      .mark img {
        width: 76px;
        height: 76px;
      }
      .word {
        color: #463c6d;
        font-size: 38px;
      }
      .word b {
        font-weight: 700;
      }
      .word span {
        font-weight: 400;
      }
      h1 {
        font-size: 50px;
        font-weight: 600;
        line-height: 1.08;
        letter-spacing: -0.01em;
      }
      p {
        margin-top: 26px;
        color: #63635e;
        font-size: 23px;
        line-height: 1.4;
      }
      .shot {
        position: absolute;
        top: 70px;
        left: 600px;
        width: 760px;
        border: 1px solid #dad9d6;
        border-radius: 14px;
        box-shadow: 0 30px 70px rgb(0 0 0 / 0.16);
        overflow: hidden;
      }
      .shot img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="text">
      <div class="mark">
        <img src="/site/favicon.svg" alt="" />
        <div class="word"><b>Lattes</b><span>Editor</span></div>
      </div>
      <h1>Seu Currículo Lattes em um editor moderno</h1>
      <p>Gratuito e de código aberto, para macOS, Windows e Linux.</p>
    </div>
    <div class="shot"><img src="/site/img/editor-claro.jpg" alt="" /></div>
  </body>
</html>
